<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Simulation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Agent Simulation</h1>
    <div class="tick">Tick <span id="tick">0</span></div>
  </header>

  <section class="controls">
    <div class="group">
      <button id="step">Step</button>
      <button id="play">Play</button>
      <button id="run100" title="Advance 100 steps at once">+100</button>
      <label>Interval
        <input id="interval" type="range" min="16" max="1000" value="200">
        <span id="interval-label">200 ms</span>
      </label>
    </div>
    <div class="group">
      <label>Agents <input id="agent-count" type="number" min="1" max="500" value="3"></label>
      <label>Seed <input id="seed" type="number" placeholder="random"></label>
      <button id="reset">Reset</button>
    </div>
    <label class="toggle"><input id="show-range" type="checkbox" checked> Show movement range</label>
  </section>

  <main>
    <div class="world-wrap">
      <canvas id="world" width="1024" height="1024"></canvas>
    </div>
    <aside>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="overview" class="active">Overview</button>
        <button role="tab" data-tab="manage">Manage agents</button>
      </nav>

      <section id="tab-overview" role="tabpanel">
        <div id="market" class="market"></div>
        <div id="agents"></div>
        <h2>Events</h2>
        <ol id="events" reversed></ol>
      </section>

      <section id="tab-manage" role="tabpanel" hidden>
        <div class="picker">
          <button id="new-agent" class="chip">+ New agent</button>
          <span id="agent-chips"></span>
        </div>
        <p class="hint">Pick an agent (or click its dot) to edit it. Fields you haven't touched keep updating live; only the fields you change are saved.</p>
        <form id="agent-form" novalidate>
          <h3 id="form-title">New agent</h3>
          <div id="form-fields"></div>
          <div class="balance"></div>
          <div class="form-actions">
            <button type="button" id="form-remove" class="danger">Remove</button>
            <span class="spacer"></span>
            <button type="button" id="form-revert">Revert</button>
            <button type="submit" id="form-submit">Create agent</button>
          </div>
          <p id="form-status" class="status" hidden></p>
        </form>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
